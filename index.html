<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF9F2">
<title>爪记 PawLog · 养宠成长记录与社区</title>
<meta name="description" content="一站式记录宠物体重、疫苗、驱虫，自动生成成长时间线；按地域匹配附近宠友，分享养宠日常。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='20' r='8' fill='%23F4876B'/%3E%3Ccircle cx='7' cy='11' r='3.4' fill='%23F4876B'/%3E%3Ccircle cx='16' cy='7' r='3.4' fill='%23F4876B'/%3E%3Ccircle cx='25' cy='11' r='3.4' fill='%23F4876B'/%3E%3C/svg%3E">
<style>
:root{
  --cream:#FFF9F2; --sand:#FDEFE0; --ink:#3B302B; --muted:#8C7A70;
  --coral:#F4876B; --coral-deep:#E06B4E; --caramel:#C98A5B;
  --mint:#7FB48F; --mint-soft:#EAF4ED; --mint-deep:#4E8A63;
  --gold:#E4A94A; --line:#F1E3D5; --card:#FFFFFF;
  --shadow:0 10px 30px -16px rgba(107,72,48,.3);
  --r:20px; --safe: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); background:#FBF3E9; line-height:1.55; -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1200px 600px at 12% -8%, #FFE9D2 0%, transparent 60%),
    radial-gradient(900px 500px at 92% 4%, #FDE2DC 0%, transparent 55%),
    radial-gradient(800px 500px at 50% 110%, #EFF6EC 0%, transparent 60%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* ---------- shell ---------- */
.shell{display:block;min-height:100vh;width:100%;max-width:100vw;overflow-x:clip}
.side{display:none}
.phone{width:100%;max-width:480px;min-width:0;margin:0 auto;min-height:100vh;position:relative;display:flex;flex-direction:column;box-sizing:border-box}
@media(min-width:1024px){
  .shell{max-width:1180px;margin:0 auto;padding:28px 24px;gap:44px;align-items:center}
  .side{display:block;flex:1 1 420px;max-width:520px;align-self:center;animation:fadeUp .7s ease both}
  .phone{
    flex:0 0 480px;min-height:auto;height:min(910px, calc(100vh - 56px));
    background:var(--cream);border-radius:36px;overflow:hidden;
    box-shadow:0 44px 100px -46px rgba(107,72,48,.5), 0 0 0 1px rgba(107,72,48,.07);
    display:flex;flex-direction:column;
  }
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.988)}to{opacity:1;transform:none}}
@keyframes shimmer{100%{background-position:180% 0}}

/* ---------- side panel ---------- */
.side .wordmark{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.side .logo{width:46px;height:46px;flex:0 0 46px}
.side h1{font-size:31px;letter-spacing:-.4px;line-height:1.15}
.side .sub{color:var(--caramel);font-size:12px;letter-spacing:2.2px;text-transform:uppercase;margin-top:5px}
.side .lede{font-size:14.5px;color:#6B584C;margin:16px 0 22px;max-width:46ch}
.side .grid{display:grid;gap:11px}
.side .cell{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:15px;padding:13px 15px;transition:.25s}
.side .cell:hover{transform:translateY(-2px);background:#fff}
.side .cell b{display:block;font-size:13.5px;margin-bottom:2px}
.side .cell span{font-size:12.5px;color:var(--muted)}
.side .foot{margin-top:22px;font-size:12.5px;color:#A28C7E;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.side .dot{width:6px;height:6px;border-radius:50%;background:var(--coral);display:inline-block}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;padding:13px 16px 11px;
  background:linear-gradient(180deg,rgba(255,249,242,.97),rgba(255,249,242,.84));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;min-height:54px;
}
.topbar .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.2px;font-size:15.5px}
.topbar .brand svg{width:26px;height:26px}
.topbar .spacer{flex:1}
.ghost-btn{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;
  font-size:12.5px;color:#6B584C;display:inline-flex;align-items:center;gap:5px;transition:.16s;
}
.ghost-btn:active{transform:scale(.96)}
.ghost-btn.solid{background:var(--coral);border-color:var(--coral);color:#fff;font-weight:700;box-shadow:0 8px 18px -10px rgba(228,115,88,.95)}
.back-btn{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:0 0 34px}
.topbar h2{font-size:15.5px;font-weight:800;letter-spacing:-.2px}

/* ---------- scroll body ---------- */
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:15px 15px calc(94px + var(--safe))}
.view::-webkit-scrollbar{width:0}
section{animation:pop .32s ease both}

/* ---------- hero ---------- */
.hero{
  position:relative;border-radius:26px;padding:18px;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,#F9A183 0%,#F4876B 48%,#E66F55 100%);
  box-shadow:0 20px 38px -22px rgba(224,107,78,.9);margin-top:2px;
}
.hero .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}
.hero .b1{width:190px;height:190px;right:-60px;top:-76px}
.hero .b2{width:120px;height:120px;right:20px;bottom:-64px;background:rgba(255,255,255,.09)}
.hero .paw-pattern{position:absolute;inset:0;opacity:.1}
.hero-row{display:flex;align-items:center;gap:14px;position:relative}
.avatar{
  width:66px;height:66px;flex:0 0 66px;border-radius:50%;background:#FFF3E4;
  display:grid;place-items:center;box-shadow:inset 0 0 0 3px rgba(255,255,255,.8);
}
.hero h2{font-size:19.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hero .meta{font-size:12.5px;opacity:.94;margin-top:3px}
.badge{font-size:10.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.42);font-weight:700}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;position:relative}
.hero-stats div{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:9px 10px;min-width:0;overflow:hidden}
.hero-stats b{display:block;font-size:17px;line-height:1.25}
.hero-stats span{display:block;font-size:11px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-pill{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;position:relative;
  background:rgba(255,255,255,.92);color:#B4522F;font-size:11.5px;font-weight:700;
  padding:6px 11px;border-radius:999px;
}

/* ---------- cards ---------- */
html,body{overflow-x:hidden;max-width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-top:14px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-h h3{font-size:14.5px;letter-spacing:-.1px}
.card-h .tag{font-size:11px;color:var(--caramel);background:var(--sand);border-radius:999px;padding:2px 8px;white-space:nowrap}
.card-h .more{margin-left:auto;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:#6B584C;transition:.16s;
}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff;font-weight:700}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--coral);color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;font-weight:700;
  box-shadow:0 10px 22px -13px rgba(228,115,88,.95);transition:.16s;
}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:11px;font-weight:600}
.btn.ghost{background:#fff;color:#6B584C;border:1px solid var(--line);box-shadow:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;box-shadow:none}

/* ---------- todo ---------- */
.todo{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.todo:last-child{border-bottom:0;padding-bottom:2px}
.todo .ico{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:var(--sand)}
.todo .t{flex:1;min-width:0}
.todo .t b{font-size:13.5px;display:block}
.todo .t span{font-size:11.5px;color:var(--muted)}
.dot-done{font-size:11.5px;color:var(--mint-deep);font-weight:700;white-space:nowrap}
.dot-soon{font-size:11.5px;color:var(--coral-deep);font-weight:700;white-space:nowrap}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:8px;width:2px;background:linear-gradient(180deg,#F6D9C8,#FBE9D6)}
.tl-item{position:relative;padding-bottom:15px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--coral)}
.tl-item[data-k="vaccine"]::before{border-color:var(--mint)}
.tl-item[data-k="deworm"]::before{border-color:var(--gold)}
.tl-item[data-k="post"]::before{border-color:#E9B44C}
.tl-item[data-k="milestone"]::before{border-color:var(--caramel)}
.tl-date{font-size:11px;color:var(--muted);letter-spacing:.4px}
.tl-body{background:#FFFCF8;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:5px}
.tl-body b{font-size:13.5px}
.tl-body p{font-size:12.5px;color:#6B584C;margin-top:2px}
.tl-photo{margin-top:8px;display:flex;gap:6px}
.tl-photo i{width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#FDE6D5,#F8D6C7);display:grid;place-items:center;font-size:20px}
.month-head{
  position:sticky;top:0;z-index:5;margin:16px -4px 10px;padding:6px 4px;
  font-size:12px;font-weight:800;color:var(--caramel);letter-spacing:.5px;
  background:linear-gradient(180deg,rgba(255,249,242,.98),rgba(255,249,242,.9));
  backdrop-filter:blur(6px);display:flex;align-items:center;gap:8px;
}
.month-head:first-child{margin-top:2px}
.month-head::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- chart ---------- */
.chart-wrap{margin:4px -4px 0}
.chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.chart-x{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:6px 10px 0}
.kpi-row{display:flex;gap:10px;margin-top:12px}
.kpi{flex:1;min-width:0;background:var(--sand);border-radius:13px;padding:9px 11px;overflow:hidden}
.kpi b{display:block;font-size:15px}
.kpi span{font-size:10.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;font-size:10.5px;color:var(--muted);margin-top:8px;padding-left:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- records & progress ---------- */
.rec{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.rec:last-child{border-bottom:0;padding-bottom:0}
.rec .ico{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;font-size:18px;background:var(--mint-soft)}
.rec .ico.warm{background:var(--sand)}
.rec .t{flex:1;min-width:0}
.rec .t b{font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rec .t p{font-size:11.5px;color:var(--muted);margin-top:2px}
.state{font-size:10.5px;padding:1.5px 7px;border-radius:999px;font-weight:700}
.state.ok{background:var(--mint-soft);color:var(--mint-deep)}
.state.due{background:#FDECEA;color:#C4573C}
.state.soon{background:#FDF3E2;color:#A9762A}
.bar{height:6px;border-radius:999px;background:#F4E7DA;overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F7A98D,#F4876B);transition:width .6s cubic-bezier(.3,.8,.3,1)}
.bar.mint > i{background:linear-gradient(90deg,#9CCBA9,#7FB48F)}
.cal-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:2px}
.cal-strip::-webkit-scrollbar{height:0}
.cal-day{flex:0 0 46px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:7px 0;background:#fff}
.cal-day span{display:block;font-size:10px;color:var(--muted)}
.cal-day b{display:block;font-size:13px}
.cal-day i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:transparent}
.cal-day[data-on="1"]{background:#FFF4EC;border-color:#F8D3C4}
.cal-day[data-on="1"] i{background:var(--coral)}

/* ---------- community ---------- */
.post{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:var(--shadow);animation:pop .3s ease both}
.post-h{display:flex;align-items:center;gap:10px}
.post-h .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--sand)}
.post-h .nm{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.post-h .tm{font-size:11px;color:var(--muted)}
.loc{font-size:10.5px;color:var(--caramel);background:var(--sand);padding:1px 7px;border-radius:999px;font-weight:600}
.post-b{font-size:13.5px;color:#4B3C33;margin:10px 0 0}
.post-media{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.post-media i{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#FDE7D6,#F7D9C9)}
.post-a{display:flex;gap:18px;margin-top:11px;font-size:12.5px;color:var(--muted);align-items:center}
.post-a button{display:inline-flex;align-items:center;gap:5px;color:inherit;transition:.16s}
.post-a button:active{transform:scale(.95)}
.post-a button[aria-pressed="true"]{color:var(--coral-deep);font-weight:700}

/* ---------- nearby ---------- */
.friend{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.friend:last-child{border-bottom:0;padding-bottom:0}
.friend .av{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--sand)}
.friend .t{flex:1;min-width:0}
.friend .t b{font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.friend .t p{font-size:11.5px;color:var(--muted)}
.km{font-size:11px;color:var(--caramel);font-weight:700;background:var(--sand);padding:2px 8px;border-radius:999px;white-space:nowrap}
.fc{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px;background:#FFFCF8}
.fc-head{display:flex;align-items:center;gap:12px}
.fc-head .av{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--sand)}
.fc-head .t{flex:1;min-width:0}
.fc-head .t b{font-size:13.5px;display:block}
.fc-head .t p{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{position:relative;flex:0 0 50px;width:50px;height:50px;display:grid;place-items:center}
.score svg{position:absolute;inset:0;width:50px;height:50px;transform:rotate(-90deg)}
.score b{position:relative;font-size:13px;font-weight:800;color:var(--coral-deep);line-height:1}
.score span{position:absolute;bottom:-13px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}
.fc .why{margin:8px 0 0;padding:0}
.fc .why summary{font-size:11.5px;color:var(--coral-deep);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px}
.fc .why summary::-webkit-details-marker{display:none}
.fc .why summary::before{content:"？";display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:#FBE3D8;font-size:9px;font-weight:800}
.fc .why ul{margin-top:7px;background:#FFF;border:1px dashed #F3DCCB;border-radius:12px;padding:9px 11px}
.fc .why li{font-size:11.5px;color:#7A6558;padding:2px 0;display:flex;gap:6px}
.fc-act{display:flex;gap:8px;margin-top:10px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .e{font-size:34px;opacity:.6}
.empty p{font-size:12.5px;margin-top:8px}

/* ---------- me ---------- */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border-bottom:0;padding-bottom:0}
.row .k{color:var(--muted);width:78px;flex:0 0 78px;font-size:12.5px}
.row .v{flex:1;min-width:0}
.row .v input,.row .v select{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;color:var(--ink);background:#FFFCF8;
}
.row .v input:focus,.row .v select:focus{outline:2px solid #FBD9CB;outline-offset:1px}
.switch{width:44px;height:26px;border-radius:999px;background:#EADFD4;position:relative;transition:.2s;flex:0 0 44px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.15);transition:.2s}
.switch[aria-checked="true"]{background:var(--coral)}
.switch[aria-checked="true"]::after{left:21px}

/* ---------- about ---------- */
.about-hero{border-radius:24px;padding:20px;background:linear-gradient(150deg,#3B302B,#5C4438);color:#fff;position:relative;overflow:hidden;box-shadow:0 22px 40px -26px rgba(59,48,43,.9)}
.about-hero h2{font-size:19px;letter-spacing:-.2px}
.about-hero p{font-size:13px;color:#E8D9CB;margin-top:8px;line-height:1.7}
.about-hero .k{font-size:11px;letter-spacing:2px;color:#E9B44C;font-weight:700;margin-bottom:6px}
.sec{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}
.sec > h3{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec > h3 em{font-style:normal;font-size:10.5px;color:#fff;background:var(--coral);width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font-weight:800;flex:0 0 20px}
.sec p{font-size:12.8px;color:#5D4C42;line-height:1.75}
.sec p + p{margin-top:8px}
.sec ul.li li{font-size:12.8px;color:#5D4C42;line-height:1.7;padding:5px 0 5px 16px;position:relative}
.sec ul.li li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:#F0C9B8}
.sec ul.li b{color:#3B302B}
.arch{display:grid;gap:8px;margin-top:4px}
.arch .node{display:flex;align-items:center;gap:10px;background:#FFF8F1;border:1px solid #F5E3D5;border-radius:13px;padding:10px 12px}
.arch .node span{font-size:17px}
.arch .node div{font-size:12.5px;line-height:1.5}
.arch .node b{display:block;font-size:13px}
.tradeoff{border-left:3px solid #F3C9B6;padding:2px 0 2px 12px;margin-top:12px}
.tradeoff b{font-size:13px;display:block;margin-bottom:3px}
.tradeoff p{font-size:12.5px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tagline span{font-size:11px;background:var(--sand);color:#8A6A52;border-radius:999px;padding:3px 9px}

/* ---------- tabbar ---------- */
.tabbar{
  position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + var(--safe));
}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#A28C7E;padding:4px 0;border-radius:12px;transition:.16s}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--coral-deep);font-weight:800;transform:translateY(-1px)}
.tabbar button .pip{width:4px;height:4px;border-radius:50%;background:var(--coral);opacity:0;transform:scale(.4);transition:.2s}
.tabbar button[aria-selected="true"] .pip{opacity:1;transform:scale(1)}

/* ---------- sheet / toast / skeleton ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:80;display:grid;align-items:end;background:rgba(59,48,43,.36);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-wrap[data-open="1"]{opacity:1;pointer-events:auto}
.sheet{
  background:var(--cream);border-radius:26px 26px 0 0;padding:18px 18px calc(18px + var(--safe));
  transform:translateY(20px);transition:transform .24s cubic-bezier(.3,.8,.3,1);max-height:86vh;overflow:auto;
  width:100%;max-width:480px;margin:0 auto;
}
.sheet-wrap[data-open="1"] .sheet{transform:none}
.sheet h4{font-size:16px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;
  background:#fff;color:var(--ink);
}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #FBD9CB;outline-offset:1px}
.field textarea{min-height:96px;resize:vertical}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:120;
  background:#3B302B;color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.24s;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis;
}
.toast[data-show="1"]{opacity:.96;transform:translate(-50%,0)}
.sk{background:linear-gradient(90deg,#F6EADF 0%,#FCF4EC 40%,#F6EADF 80%);background-size:180% 100%;animation:shimmer 1.2s linear infinite;border-radius:16px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="wordmark">
      <svg class="logo" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="27" r="11" fill="#F4876B"/>
        <circle cx="10" cy="15" r="4.6" fill="#F4876B"/>
        <circle cx="22" cy="10" r="4.6" fill="#F4876B"/>
        <circle cx="34" cy="15" r="4.6" fill="#F4876B"/>
        <circle cx="22" cy="25" r="4" fill="#FFF9F2" opacity=".55"/>
      </svg>
      <div>
        <h1>爪记 PawLog</h1>
        <div class="sub">Pet growth · Community</div>
      </div>
    </div>
    <p class="lede">年轻人养宠最大的断层不是「爱不爱」，而是<strong>养得对不对</strong>。爪记把散落在备忘录、相册、宠物医院的记录，收拢成一条可回溯的成长线；再把同城养宠人连成一张可信任的邻里网络。</p>
    <div class="grid">
      <div class="cell"><b>① 健康档案不再靠记忆</b><span>体重曲线、疫苗时效、驱虫周期统一管理，到期主动提醒。</span></div>
      <div class="cell"><b>② 成长时间线自动生成</b><span>每次称重、每一针、每条动态自动落进同一条时间轴。</span></div>
      <div class="cell"><b>③ 找到「同一栋楼」的宠友</b><span>按城市 / 小区 / 宠物类型匹配，并说明推荐理由。</span></div>
    </div>
    <p class="foot"><span class="dot"></span>右侧为可交互原型 · 数据保存在本机 · 点顶部「产品说明」看设计取舍</p>
  </aside>

  <main class="phone">
    <header class="topbar" id="topbar"></header>
    <div class="view" id="view"></div>
    <nav class="tabbar" role="tablist" aria-label="主导航">
      <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.2 12 4l9 7.2"/><path d="M5.5 10v9.5h13V10"/></svg><span>首页</span><i class="pip"></i></button>
      <button role="tab" data-tab="health" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.2-5 3.2 10 2.2-5H21"/></svg><span>健康</span><i class="pip"></i></button>
      <button role="tab" data-tab="community" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.2"/><path d="M3.2 19c.5-3.1 2.8-4.8 5.8-4.8S14.3 15.9 14.8 19"/><circle cx="17.2" cy="10.2" r="2.5"/><path d="M16 15.4c2.4.2 4 1.7 4.4 4.1"/></svg><span>社区</span><i class="pip"></i></button>
      <button role="tab" data-tab="me" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.8 20c.7-3.7 3.6-5.6 7.2-5.6s6.5 1.9 7.2 5.6"/></svg><span>我的</span><i class="pip"></i></button>
    </nav>
  </main>
</div>

<div class="sheet-wrap" id="sheet" data-open="0" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet" id="sheet-body"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const KEY = "pawlog.v3";

  /* 演示数据以「今天」为基准生成：无论哪天打开，看到的都是最新鲜的状态 */
  const pad = n => String(n).padStart(2, "0");
  const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const D = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoOf(d); };
  const M = n => { const d = new Date(); d.setMonth(d.getMonth() + n); return isoOf(d); };

  /* ================= seed ================= */
  const SEED = {
    pet: { name:"豆豆", kind:"柯基犬", sex:"公", birth:M(-26), city:"上海", district:"徐汇区", community:"汇成苑", avatar:"🐶", range:[10,14], rangeNote:"成犬标准 10–14 kg" },
    weights: [
      { d:D(-250), kg:4.2 }, { d:D(-215), kg:5.6 }, { d:D(-180), kg:6.9 },
      { d:D(-140), kg:8.1 }, { d:D(-100), kg:9.0 }, { d:D(-60), kg:9.6 },
      { d:D(-25), kg:10.1 }, { d:D(-6), kg:10.4 }
    ],
    vaccines: [
      { name:"狂犬疫苗", date:D(-238), next:D(127) },
      { name:"犬四联（第 3 针）", date:D(-236), next:D(129) },
      { name:"犬窝咳疫苗", date:D(-320), next:D(45) }
    ],
    deworm: [
      { name:"体内驱虫", drug:"拜宠清", date:D(-27), cycle:"每月", next:D(3) },
      { name:"体外驱虫", drug:"福来恩", date:D(-32), cycle:"每月", next:D(-2) }
    ],
    posts: [
      { id:"p1", user:"橘子妈妈", avatar:"🐱", pet:"橘猫 · 2 岁", city:"上海 · 徐汇", text:"第一次带橘子坐地铁去体检，全程装包不敢出声，到家立刻拆包巡视领地 3 分钟 😹", media:2, emoji:"🐱", likes:24, liked:false, cmt:6, t:"12 分钟前" },
      { id:"p2", user:"阿柴和麦克", avatar:"🐕", pet:"柴犬 · 3 岁", city:"上海 · 徐汇", text:"求问徐汇附近有没有会剪柴犬「狮子头」的店？上次剪完像被啃过…配图是它现在对我翻白眼的样子。", media:1, emoji:"✂️", likes:11, liked:false, cmt:23, t:"48 分钟前" },
      { id:"p3", user:"馒头他爸", avatar:"🐰", pet:"垂耳兔 · 1 岁", city:"上海 · 长宁", text:"记录一下馒头的体重曲线，三个月稳定 1.8kg，医生说标准。兔子的体重其实比狗更需要盯。", media:0, emoji:"📈", likes:39, liked:false, cmt:4, t:"2 小时前" }
    ],
    settings: { vaccine:true, deworm:true, weekly:true }
  };

  const CITY_FRIENDS = {
    "上海": [
      { name:"橘子妈妈", avatar:"🐱", pet:"橘猫 · 2 岁", species:"cat", km:0.3, area:"汇成苑 · 同小区", tags:["猫","同小区"], shared:"汇成苑中央花园" },
      { name:"阿柴和麦克", avatar:"🐕", pet:"柴犬 · 3 岁", species:"dog", km:0.6, area:"徐汇 · 田林", tags:["狗","遛狗搭子"], shared:"田林公园" },
      { name:"布丁小姐", avatar:"🐩", pet:"比熊 · 4 岁", species:"dog", km:1.1, area:"徐汇 · 漕河泾", tags:["狗","同城"], shared:"漕河泾绿地" },
      { name:"馒头他爸", avatar:"🐰", pet:"垂耳兔 · 1 岁", species:"other", km:2.4, area:"长宁 · 中山公园", tags:["异宠","同城"], shared:"" },
      { name:"豆花与豆浆", avatar:"🐈‍⬛", pet:"黑猫 · 5 岁", species:"cat", km:3.8, area:"徐汇 · 上海南站", tags:["猫","寄养互助"], shared:"" }
    ],
    "北京": [
      { name:"大头和土豆", avatar:"🐕", pet:"边牧 · 2 岁", species:"dog", km:0.4, area:"朝阳 · 望京", tags:["狗","同小区"], shared:"望京公园" },
      { name:"三花女士", avatar:"🐈", pet:"三花猫 · 6 岁", species:"cat", km:0.9, area:"朝阳 · 望京", tags:["猫","同城"], shared:"" },
      { name:"年年有余", avatar:"🐠", pet:"金鱼 · 1 岁", species:"other", km:1.6, area:"朝阳 · 酒仙桥", tags:["异宠","同城"], shared:"" },
      { name:"可乐不加冰", avatar:"🐕", pet:"金毛 · 4 岁", species:"dog", km:2.8, area:"朝阳 · 三里屯", tags:["狗","同城"], shared:"朝阳公园" }
    ],
    "成都": [
      { name:"花椒妈", avatar:"🐕", pet:"中华田园犬 · 3 岁", species:"dog", km:0.2, area:"武侯 · 玉林", tags:["狗","同小区"], shared:"玉林东路" },
      { name:"熊猫不吃竹子", avatar:"🐈", pet:"狸花猫 · 2 岁", species:"cat", km:0.7, area:"武侯 · 玉林", tags:["猫","同城"], shared:"" },
      { name:"串串香", avatar:"🐕", pet:"泰迪 · 5 岁", species:"dog", km:1.4, area:"锦江 · 春熙路", tags:["狗","同城"], shared:"人民公园" },
      { name:"小汤圆", avatar:"🐹", pet:"仓鼠 · 8 个月", species:"other", km:3.1, area:"青羊 · 宽窄巷子", tags:["异宠","同城"], shared:"" }
    ]
  };

  /* ================= state ================= */
  const clone = o => JSON.parse(JSON.stringify(o));
  let S;
  try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : clone(SEED); }
  catch (e) { S = clone(SEED); }
  if (!S.settings) S.settings = clone(SEED.settings);
  if (!S.pet.range) S.pet.range = [10, 14];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  /* ================= helpers ================= */
  const $ = (s, r = document) => r.querySelector(s);
  const view = $("#view");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const today = () => isoOf(new Date());
  const fmtCN = d => { const p = String(d).split("-"); return p.length === 3 ? `${+p[1]}月${+p[2]}日` : d; };
  const monthKey = d => String(d).slice(0, 7);
  const monthLabel = k => { const p = k.split("-"); return `${p[0]} 年 ${+p[1]} 月`; };
  const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
  const ageText = birth => {
    const m = Math.max(0, Math.floor(daysBetween(birth, today()) / 30.44));
    return m >= 12 ? `${Math.floor(m / 12)} 岁 ${m % 12} 个月` : `${m} 个月`;
  };
  const speciesOf = kind => /猫/.test(kind) ? "cat" : /犬|狗/.test(kind) ? "dog" : "other";
  let toastTimer;
  function toast(msg) {
    const el = $("#toast"); el.textContent = msg; el.dataset.show = "1";
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.dataset.show = "0"), 1900);
  }
  function sheet(html) { $("#sheet-body").innerHTML = html; $("#sheet").dataset.open = "1"; }
  const closeSheet = () => ($("#sheet").dataset.open = "0");

  /* ================= derived ================= */
  const latestWeight = () => S.weights.length ? S.weights[S.weights.length - 1] : null;
  const friends = () => CITY_FRIENDS[S.pet.city] || CITY_FRIENDS["上海"];
  function nextDue(list) {
    return list.map(x => ({ ...x, days: daysBetween(today(), x.next) })).sort((a, b) => a.days - b.days)[0];
  }
  function allEvents() {
    const ev = [];
    S.weights.forEach(w => ev.push({ kind:"weight", d:w.d, emoji:"⚖️", title:`体重记录 ${w.kg} kg`,
      desc: w.kg >= (S.pet.range ? S.pet.range[0] : 0) ? "位于标准区间内，增长曲线平稳" : "低于标准区间下限，建议关注进食量" }));
    S.vaccines.forEach(v => ev.push({ kind:"vaccine", d:v.date, emoji:"💉", title:`接种 ${v.name}`, desc:`有效期至 ${v.next}` }));
    S.deworm.forEach(v => ev.push({ kind:"deworm", d:v.date, emoji:"🪱", title:`${v.name} · ${v.drug}`, desc:`周期 ${v.cycle}，下次 ${v.next}` }));
    S.posts.filter(p => p.mine).forEach(p => ev.push({ kind:"post", d:p.date || today(), emoji:"📸", title:"发布了一条日常", desc:p.text, media:p.media }));
    ev.push({ kind:"milestone", d:(S.weights[0] && S.weights[0].d) || today(), emoji:"🌱", title:`创建了${S.pet.name}的成长档案`, desc:"从此每一次成长都有据可查" });
    return ev.sort((a, b) => (a.d < b.d ? 1 : -1));
  }
  function matchInfo(f) {
    const reasons = [];
    let score = 38;
    const distW = Math.max(0, Math.round(26 - f.km * 5));
    score += distW;
    reasons.push(`距离 ${f.km} km → +${distW} 分（越近权重越高）`);
    if (f.species === speciesOf(S.pet.kind)) { score += 14; reasons.push(`同为${f.species === "dog" ? "犬类" : f.species === "cat" ? "猫类" : "异宠"} → +14 分`); }
    if (f.tags.includes("同小区")) { score += 10; reasons.push("同一小区 → +10 分（可线下碰面）"); }
    else if (f.tags.includes("同城")) { score += 4; reasons.push("同城可到达 → +4 分"); }
    if (f.shared) { score += 6; reasons.push(`常去同一地点：${f.shared} → +6 分`); }
    if (f.tags.includes("寄养互助")) { score += 2; reasons.push("提供寄养互助 → +2 分"); }
    return { score: Math.min(score, 98), reasons };
  }

  /* ================= chart ================= */
  function chart(lastN, h, showBand) {
    const w = S.weights.slice(-(lastN || 8));
    if (w.length < 2) {
      return `<div class="empty"><div class="e">📈</div><p>再记录 1 次体重即可生成曲线</p></div>`;
    }
    const W = 340, H = h || 132, PL = 14, PR = 16, PT = 18, PB = 20;
    const band = showBand ? S.pet.range : null;
    const vals = w.map(x => x.kg);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (band) { lo = Math.min(lo, band[0]); hi = Math.max(hi, band[1]); }
    lo -= 0.5; hi += 0.5;
    const Y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
    const stepX = (W - PL - PR) / (w.length - 1);
    const pt = w.map((d, i) => [PL + i * stepX, Y(d.kg)]);
    const line = pt.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
    const area = `${line} L${pt[pt.length - 1][0].toFixed(1)} ${H - PB} L${pt[0][0].toFixed(1)} ${H - PB} Z`;
    const dots = pt.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === pt.length - 1 ? 4.4 : 2.8}" fill="#fff" stroke="#F4876B" stroke-width="2.2"/>`).join("");
    const last = pt[pt.length - 1];
    const bandSvg = band ? `<rect x="${PL}" y="${Y(band[1]).toFixed(1)}" width="${(W - PL - PR).toFixed(1)}" height="${Math.abs(Y(band[0]) - Y(band[1])).toFixed(1)}" fill="#EAF4ED"/>
      <line x1="${PL}" x2="${W - PR}" y1="${Y(band[1]).toFixed(1)}" y2="${Y(band[1]).toFixed(1)}" stroke="#BFDCC8" stroke-dasharray="4 4"/>
      <line x1="${PL}" x2="${W - PR}" y1="${Y(band[0]).toFixed(1)}" y2="${Y(band[0]).toFixed(1)}" stroke="#BFDCC8" stroke-dasharray="4 4"/>` : "";
    return `
      <div class="chart-wrap">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="体重变化曲线">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#F4876B" stop-opacity=".26"/>
              <stop offset="100%" stop-color="#F4876B" stop-opacity="0"/>
            </linearGradient>
          </defs>
          ${bandSvg}
          <path d="${area}" fill="url(#g1)"/>
          <path d="${line}" fill="none" stroke="#F4876B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          ${dots}
          <text x="${Math.min(last[0], W - 28)}" y="${Math.max(last[1] - 11, 12)}" text-anchor="middle" font-size="12" font-weight="700" fill="#E06B4E">${vals[vals.length - 1]}kg</text>
        </svg>
      </div>
      <div class="chart-x">${w.map(d => `<span>${fmtCN(d.d)}</span>`).join("")}</div>
      ${band ? `<div class="legend"><span><i style="background:#EAF4ED"></i>${esc(S.pet.rangeNote || "标准区间")}</span><span><i style="background:#F4876B"></i>体重记录</span></div>` : ""}`;
  }

  /* ================= components ================= */
  function heroCard() {
    const lw = latestWeight();
    const prev = S.weights.length > 1 ? S.weights[S.weights.length - 2] : null;
    const delta = lw && prev ? (lw.kg - prev.kg).toFixed(1) : "0.0";
    const dv = nextDue(S.vaccines);
    const dd = nextDue(S.deworm);
    const overdue = dd && dd.days < 0 ? dd : null;
    return `
      <div class="hero">
        <span class="blob b1"></span><span class="blob b2"></span>
        <svg class="paw-pattern" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <g fill="#fff">
            <circle cx="18" cy="24" r="7"/><circle cx="9" cy="12" r="4"/><circle cx="20" cy="8" r="4"/><circle cx="29" cy="13" r="4"/>
            <circle cx="76" cy="72" r="7"/><circle cx="67" cy="60" r="4"/><circle cx="78" cy="56" r="4"/><circle cx="87" cy="61" r="4"/>
          </g>
        </svg>
        <div class="hero-row">
          <div class="avatar" style="font-size:35px">${S.pet.avatar}</div>
          <div>
            <h2>${esc(S.pet.name)} <span class="badge">${esc(S.pet.kind)}</span></h2>
            <div class="meta">${esc(S.pet.sex)} · ${ageText(S.pet.birth)} · ${esc(S.pet.city)} ${esc(S.pet.district)}</div>
          </div>
        </div>
        <div class="hero-stats">
          <div><b>${lw ? lw.kg : "—"}</b><span>当前体重 kg${delta !== "0.0" ? `（↑${delta}）` : ""}</span></div>
          <div><b>${S.vaccines.length}</b><span>疫苗记录</span></div>
          <div><b>${dv ? Math.max(dv.days, 0) : "—"}</b><span>天后需${dv ? esc(dv.name.replace("疫苗", "")) : "提醒"}</span></div>
        </div>
        ${overdue ? `<div class="alert-pill">⏰ ${esc(overdue.name)}已逾期 ${-overdue.days} 天，记得补做</div>` : ""}
      </div>`;
  }

  function todoCard() {
    const rows = [];
    S.deworm.forEach(d => {
      const days = daysBetween(today(), d.next);
      rows.push(`<div class="todo">
        <div class="ico">🪱</div>
        <div class="t"><b>${esc(d.name)} · ${esc(d.drug)}</b><span>周期 ${esc(d.cycle)} · 上次 ${fmtCN(d.date)}</span></div>
        ${days < 0 ? `<span class="dot-soon">逾期 ${-days} 天</span>` : `<span class="dot-soon">还剩 ${days} 天</span>`}
      </div>`);
    });
    S.vaccines.forEach(v => {

          <li>接宠物医院 / 疫苗本 OCR，让建档从 10 分钟降到 30 秒</li>
          <li>多宠物切换与家庭成员共享</li>
          <li>同城活动（遛狗局、领养日）与寄养互助的信用体系</li>
          <li>体重异常的趋势预警（结合品种、年龄的参考带）</li>
        </ul>
        <p style="text-align:right;font-size:11.5px;color:#A28C7E;margin-top:12px">PawLog · 产品原型 v2</p>
      </div>
    </section>`;

  /* ================= router ================= */
  const R = { page: "tab", tab: "home" };
  function renderTopbar() {
    const tb = $("#topbar");
    if (R.page === "tab") {
      const action = (R.tab === "home" || R.tab === "health")
        ? `<button class="ghost-btn solid" data-act="add-weight">＋ 记体重</button>`
        : `<button class="ghost-btn" data-page="about">产品说明</button>`;
      tb.innerHTML = `
        <div class="brand">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <circle cx="22" cy="27" r="11" fill="#F4876B"/><circle cx="10" cy="15" r="4.6" fill="#F4876B"/>
            <circle cx="22" cy="10" r="4.6" fill="#F4876B"/><circle cx="34" cy="15" r="4.6" fill="#F4876B"/>
          </svg><span>爪记</span>
        </div><div class="spacer"></div>${action}`;
    } else {
      const title = R.page === "timeline" ? "成长时间线" : "产品说明";
      tb.innerHTML = `
        <button class="back-btn" data-act="back" aria-label="返回">‹</button>
        <h2>${title}</h2><div class="spacer"></div>
        ${R.page === "timeline" ? `<button class="ghost-btn" data-act="add-weight">＋ 记录</button>` : ""}`;
    }
  }
  function render() {
    renderTopbar();
    view.innerHTML = R.page === "tab" ? V[R.tab]() : V[R.page]();
    document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", String(R.page === "tab" && b.dataset.tab === R.tab)));
    view.scrollTop = 0;
    try { const h = "#" + (R.page === "tab" ? R.tab : R.page); if (location.hash !== h) history.replaceState(null, "", h); } catch (e) {}
  }
  const goTab = t => { if (!V[t]) return; R.page = "tab"; R.tab = t; render(); };
  const goPage = p => { if (!V[p]) return; R.page = p; render(); };
  const back = () => { R.page = "tab"; render(); };
  function routeFromHash() {
    const raw = (typeof location !== "undefined" && location.hash) || "";
    const h = String(raw).replace("#", "");
    if (["health", "community", "me"].includes(h)) { R.page = "tab"; R.tab = h; }
    else if (h === "timeline" || h === "about") { R.page = h; }
  }

  /* ================= actions ================= */
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act],[data-tab],[data-page],[data-filter],[data-tlf]");
    if (!t) return;
    const act = t.dataset.act;

    if (t.dataset.tab && !act) { goTab(t.dataset.tab); return; }
    if (t.dataset.page && !act) { goPage(t.dataset.page); return; }
    if (t.dataset.filter) { cf = t.dataset.filter; render(); return; }
    if (t.dataset.tlf) { tlFilter = t.dataset.tlf; render(); return; }

    switch (act) {
      case "back": back(); break;
      case "add-weight":
        sheet(`<h4 id="sheet-title">记录体重</h4>
          <div class="field"><label>体重（kg）</label><input id="w-kg" type="number" step="0.1" min="0.1" inputmode="decimal" value="${latestWeight() ? latestWeight().kg : ""}" placeholder="例如 10.4"></div>
          <div class="field"><label>日期</label><input id="w-d" type="date" value="${today()}"></div>
          <p style="font-size:11.5px;color:var(--muted);margin-bottom:12px">体重落在标准区间 ${S.pet.range ? S.pet.range.join("–") + " kg" : "—"} 内会标记为达标。</p>
          <div style="display:flex;gap:10px"><button class="btn ghost" data-act="close">取消</button><button class="btn wide" data-act="save-weight">保存</button></div>`);
        break;
      case "save-weight": {
        const kg = parseFloat($("#w-kg").value);
        const d = $("#w-d").value || today();
        if (!kg || kg <= 0) { toast("请输入有效体重"); return; }
        S.weights.push({ d, kg: Math.round(kg * 10) / 10 });
        S.weights.sort((a, b) => (a.d < b.d ? -1 : 1));
        save(); closeSheet(); render(); toast(`已记录 ${kg} kg，时间线已更新`);
        break;
      }
      case "vaccine-new":
        sheet(`<h4 id="sheet-title">添加疫苗记录</h4>
          <div class="field"><label>疫苗名称</label><input id="v-name" placeholder="例如 狂犬疫苗"></div>
          <div class="field"><label>接种日期</label><input id="v-date" type="date" value="${today()}"></div>
          <div class="field"><label>到期日期</label><input id="v-next" type="date" value="${(() => { const d = new Date(); d.setFullYear(d.getFullYear() + 1); return isoOf(d); })()}"></div>
          <div style="display:flex;gap:10px"><button class="btn ghost" data-act="close">取消</button><button class="btn wide" data-act="save-vaccine">保存</button></div>`);
        break;
      case "save-vaccine": {
        const name = ($("#v-name").value || "").trim();
        if (!name) { toast("请填写疫苗名称"); return; }
        S.vaccines.push({ name, date: $("#v-date").value || today(), next: $("#v-next").value || today() });
        save(); closeSheet(); goTab("health"); toast("疫苗记录已添加");
        break;
      }
      case "vaccine-done": {
        const i = +t.dataset.i, v = S.vaccines[i];
        const nx = new Date(v.next); nx.setFullYear(nx.getFullYear() + 1);
        v.date = today(); v.next = isoOf(nx);
        save(); render(); toast(`已续种，下次到期 ${v.next}`);
        break;
      }
      case "add-deworm":
        sheet(`<h4 id="sheet-title">添加驱虫记录</h4>
          <div class="field"><label>类型</label><select id="d-name"><option>体内驱虫</option><option>体外驱虫</option></select></div>
          <div class="field"><label>药品</label><input id="d-drug" placeholder="例如 拜宠清"></div>
          <div class="field"><label>下次日期</label><input id="d-next" type="date" value="${today()}"></div>
          <div style="display:flex;gap:10px"><button class="btn ghost" data-act="close">取消</button><button class="btn wide" data-act="save-deworm">保存</button></div>`);
        break;
      case "save-deworm": {
        S.deworm.push({ name: $("#d-name").value, drug: ($("#d-drug").value || "未填写"), date: today(), cycle: "每月", next: $("#d-next").value || today() });
        save(); closeSheet(); render(); toast("驱虫记录已添加");
        break;
      }
      case "deworm-done": {
        const i = +t.dataset.i, d = S.deworm[i];
        d.date = today();
        const nx = new Date(today()); nx.setMonth(nx.getMonth() + 1);
        d.next = isoOf(nx);
        save(); render(); toast(`已完成，下次 ${d.next}`);
        break;
      }
      case "new-post":
        sheet(`<h4 id="sheet-title">分享养宠日常</h4>
          <div class="field"><label>说点什么</label><textarea id="p-text" placeholder="今天带 ${esc(S.pet.name)} 去了…"></textarea></div>
          <div class="field"><label>配图（原型以占位块呈现）</label><select id="p-media"><option value="0">不配图</option><option value="1">1 张</option><option value="3">3 张</option></select></div>
          <div style="display:flex;gap:10px"><button class="btn ghost" data-act="close">取消</button><button class="btn wide" data-act="save-post">发布</button></div>`);
        break;
      case "save-post": {
        const text = (($("#p-text") || {}).value || "").trim();
        if (!text) { toast("写点内容再发布"); return; }
        S.posts.unshift({ id: "p" + Date.now(), user: `我（${S.pet.name}的家长）`, avatar: S.pet.avatar, pet: S.pet.kind,
          city: `${S.pet.city} · ${S.pet.district}`, text, media: +($("#p-media").value || 0), emoji: "🐾",
          likes: 0, liked: false, cmt: 0, t: "刚刚", mine: true, date: today() });
        save(); closeSheet(); goTab("community"); toast("已发布，时间线同步记录");
        break;
      }
      case "like": {
        const p = S.posts.find(x => x.id === t.dataset.id);
        if (!p) return;
        p.liked = !p.liked; p.likes += p.liked ? 1 : -1; save(); render();
        break;
      }
      case "cmt": toast("评论在下一版开放，先留个爱心吧"); break;
      case "hi": toast(`已向 ${t.dataset.n} 打招呼 · 对方接受后可见联系方式`); break;
      case "follow": toast(`已关注 ${t.dataset.n}`); break;
      case "toggle": {
        const k = t.dataset.k;
        S.settings[k] = !S.settings[k]; save();
        t.setAttribute("aria-checked", String(S.settings[k]));
        toast(`${S.settings[k] ? "已开启" : "已关闭"}提醒`);
        break;
      }
      case "save-profile": {
        S.pet.name = ($("#f-name").value || "").trim() || S.pet.name;
        S.pet.kind = ($("#f-kind").value || "").trim() || S.pet.kind;
        S.pet.birth = $("#f-birth").value || S.pet.birth;
        S.pet.city = $("#f-city").value || S.pet.city;
        S.pet.community = ($("#f-community").value || "").trim() || S.pet.community;
        save(); render(); toast("档案已保存，附近宠友已按城市刷新");
        break;
      }
      case "export": {
        const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${S.pet.name}-成长档案.json`;
        a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast("已导出 JSON");
        break;
      }
      case "reset": S = clone(SEED); save(); render(); toast("已重置为演示数据"); break;
      case "close": closeSheet(); break;
    }
  });

  $("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  document.querySelectorAll(".tabbar button").forEach(b => b.addEventListener("click", () => goTab(b.dataset.tab)));

  /* ================= boot ================= */
  view.innerHTML = `
    <div class="sk" style="height:120px;margin-top:4px"></div>
    <div class="sk" style="height:150px;margin-top:14px"></div>
    <div class="sk" style="height:190px;margin-top:14px"></div>`;
  routeFromHash();
  setTimeout(() => { render(); }, 280);
})();
</script>
</body>
</html>
